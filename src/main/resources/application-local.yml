logging:
  level:
    com.slack.api: DEBUG

spring:
  config:
    activate:
      on-profile: local

  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000
        dialect: org.hibernate.dialect.MariaDBDialect
        show_sql: true